# The /llms.txt document, regenerated by src/pages/llms.txt.ts. Brand +
# consultant come from {{BRAND_NAME}}/{{CONSULTANT_NAME}}; the {{SITE_URL}} /
# {{APP_URL}} markers are filled from env by the endpoint.
llms: |
  # {{BRAND_NAME}}

  > Senior software consultancy delivered through one transparent platform. The customer always knows where their project stands: live status at every stage, a single secure thread with the consultant and the build agent, the demo and the code in view. Two delivery modes with the same senior standard: a Curated AI MVP built by agents under {{CONSULTANT_NAME}}'s supervision, or a bespoke engagement hand-built and quoted by the consultant (Direct quote).

  Status: alpha.

  ## The platform (applies to both delivery modes)

  - Live project status, end to end: every project moves through explicit stages (review, estimate, build, demo, delivery); each change is visible in real time on the dashboard and notified by email.
  - One secure communication thread per project: customer, consultant, and the build agent in the same place; message history is immutable; a human can be pulled in at any moment with one click.
  - The build itself is observable: agent progress streams to a build panel; the result runs as a password-protected live demo on its own subdomain.
  - Code is delivered as pull requests the customer can read line by line (to the customer's own GitHub repository when they have one); the customer merges and approves the delivery.
  - Costs are visible: an estimate before work starts, consumption metered live during AI builds, prepaid credits; no surprise invoice.
  - Secrets shared by the customer are encrypted at rest and only reach the isolated build sandbox; never demo containers or logs.

  ## Two ways to work with {{BRAND_NAME}} (same standard, different hands)

  AI-curated does not mean cheap or unattended: on both paths {{CONSULTANT_NAME}} personally reviews, scopes, and stays accountable for the work. The choice is about who writes the code.

  1. Curated AI MVP ("Curated AI") - AI agents build the MVP under the consultant's direction and supervision.
     - Reviewed and estimated by {{CONSULTANT_NAME}} before any code is written; never on autopilot.
     - The agent works inside the consultant's curated knowledge base and follows senior project structures (OCPA) with CVE and threat-model awareness from the first commit.
     - The customer watches the build live, reads the code, and approves the result; the MVP runs as a live demo on its own subdomain.
     - Priced with prepaid, pay-as-you-go credits metered in real time.
     - Best for putting a serious MVP in front of users in days, with senior oversight built in - faster and more affordable because of how it is made, not because less care goes in.

  2. Direct quote - a custom-made engagement hand-built by the consultant.
     - For heavier or more sensitive work: infrastructure refactoring and migration, regulated programmes, deep architecture work.
     - Reviewed personally by {{CONSULTANT_NAME}}, who returns a bespoke quote; no charge to submit a request.
     - Tracked on the same platform with the same visibility: live status, one secure thread, full history.
     - Best for work that calls for a senior human's hands rather than an agent's.

  ## Where you work with {{BRAND_NAME}}: the web app, or your own coding agent (MCP)

  Both delivery modes run through the platform ({{APP_URL}}). The Curated AI path can also be driven from the customer's own coding agent: {{BRAND_NAME}} exposes an MCP server ({{MCP_URL}}, streamable HTTP, bearer token minted in the app at {{TOKENS_URL}}) that Claude Code, Codex, OpenCode, Hermes, OpenClaw or any MCP-capable client can connect to.

  - A project-scoped token works on ONE project and exposes three billable tools: `search_knowledge` (a cited answer from {{CONSULTANT_NAME}}'s knowledge base, using that project's own model and knowledge-base selection), `consult_codebase` (the build agent reads the project's repositories and answers - nothing edited, committed or pushed) and `delegate_development` (a specification filed as a request on the project; the same pipeline builds it and opens a pull request the customer reviews and merges; `get_delegation` polls it).
  - An account-wide token lists the customer's projects, reads their status and can create a project; it cannot query the knowledge base.
  - Knowledge queries are counted, never recorded: the platform keeps the number of queries and their cost, not the questions or the answers.
  - Every call is metered on the same prepaid credits and billed to the project it belongs to; delegated work goes through the same pipeline and guardrails as a request filed on the platform.

  ## How the Curated AI MVP works

  1. Describe the project through a short guided intake (plain language, no spec document required).
  2. Curated review: {{CONSULTANT_NAME}} reviews feasibility and scope, then gives an honest estimate before any code is written.
  3. A sandboxed agent builds the MVP following senior structures and secure defaults; progress streams live to the customer's dashboard.
  4. The MVP runs as a live demo on a subdomain; the customer tracks status, reads code, requests changes, and chats with the agent and with the consultant.
  5. Optional manual production engagement, quoted separately.

  ## Programs (ready-made automations)

  Beyond projects, the platform offers Programs: small automations {{CONSULTANT_NAME}} builds and operates. A customer adds a program from the catalog, fills in the inputs it declares (the form is generated and validated from the program's own definition), and runs it on demand or on a schedule.

  - Each run executes in an isolated sandbox; its log streams live, and the output (text plus downloadable files) stays in the run history.
  - Every run ends with a webhook call to the customer's endpoint carrying the output - or the error, stated plainly.
  - Each program instance has a dedicated SSH key the customer can authorize on their own systems, so a program can reach a database or repository.
  - Billing is per run, metered from the same prepaid credits at the rate shown on each program.
  - Example programs: curated cybersecurity news ingested into a customer database, a weekly CVE digest, a repository health report.

  ## Pricing

  - Curated AI MVP: prepaid credits, 1 credit = 1 EUR. Builds draw down credits based on what the AI actually consumes; the estimate is shown before the build starts and consumption is metered live as it runs.
  - Direct quote: a custom quote from {{CONSULTANT_NAME}} after reviewing the request. No upfront charge to submit a request.
  - Production-level engagements (review, hardening, deployment) are scoped and quoted separately.
  - Programs: billed per run from the same prepaid credits (model usage metered, rate shown on each program).

  ## Security and trust

  - Self-hostable on the infrastructure of your choice; your project and its data stay in the jurisdiction you answer to.
  - Practices designed with sensitive and regulated workloads in mind.
  - Generated code runs in an isolated, hardened sandbox; secrets are never exposed to demo environments.

  ## Links

  - Marketing site: {{SITE_URL}}
  - Application (sign up / sign in): {{APP_URL}}
  - MCP server (streamable HTTP, bearer token from {{TOKENS_URL}}): {{MCP_URL}}

  ## Contact

  Consultant: {{CONSULTANT_NAME}}.
