# The hero project card, cycled through the §8 lifecycle. Icons/glyphs are
# referenced by id (see the icon + glyph sets in index.astro).
phases:
  - chip: { label: "In review", tone: "wait", indicator: "hourglass" }
    stages: ["active", "", "", "", ""]
    events:
      - icon: "message"
        body: "Thanks - reviewing the CRM pilot brief for scope and feasibility now."
        meta: "{{CONSULTANT_NAME}} · just now"
      - icon: "shieldNode"
        body: "Screened against OCPA rules and the threat model"
        meta: "Automated pre-flight"
  - chip: { label: "Estimating", tone: "wait", indicator: "chrono" }
    stages: ["done", "active", "", "", ""]
    events:
      - icon: "meter"
        body: "Estimate ready: about 1,500 credits for the MVP scope."
        meta: "{{CONSULTANT_NAME}} · just now"
      - icon: "message"
        body: "Approve the estimate and the agent starts building."
        meta: "Awaiting your go-ahead"
  - chip: { label: "In build", tone: "build", indicator: "spinner" }
    stages: ["done", "done", "active", "", ""]
    events:
      - icon: "message"
        body: "“Estimate approved - the agent just started. Watch it here.”"
        meta: "{{CONSULTANT_NAME}} · 2 min ago"
      - icon: "zap"
        body: "1,284 of ~1,500 estimated credits"
        meta: "Metered live during the build"
  - chip: { label: "Live demo", tone: "build", indicator: "broadcast" }
    stages: ["done", "done", "done", "active", ""]
    events:
      - icon: "terminal"
        body: "Your CRM pilot is live on its own subdomain - password-protected."
        meta: "Ready to explore"
      - icon: "pr"
        body: "Pull request #4 opened - read it line by line."
        meta: "Merge when you are satisfied"
  - chip: { label: "Delivered", tone: "done", indicator: "check" }
    stages: ["done", "done", "done", "done", "done"]
    events:
      - icon: "check"
        body: "Delivery approved - the CRM pilot MVP is yours."
        meta: "You · just now"
      - icon: "badge"
        body: "1,472 credits used - under the ~1,500 estimate."
        meta: "Final metering"

