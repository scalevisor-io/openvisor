# ------------------------------------------------------------------ #
# White-label landing content (neutral Openvisor defaults).
#
# This committed file holds ALL activity-specific copy for the landing.
# To white-label the site, copy it to `site.yml` (gitignored) in this
# directory and edit freely - when present, site.yml REPLACES this file
# wholesale (no merge). Brand name, consultant name, colours and site URL
# arrive separately from build-time env (see .env `# Brand` block); the
# {{BRAND_NAME}} and {{CONSULTANT_NAME}} placeholders below are filled from
# BRAND_NAME / CONSULTANT_NAME at build time. Icons are referenced by id;
# the SVG set itself lives in src/pages/index.astro.
# ------------------------------------------------------------------ #

