server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/xml
        application/xml+rss
        application/json
        application/javascript
        image/svg+xml
        font/otf;

    # Astro emits fully hashed asset filenames - cache them hard.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Static assets (fonts, images) - long cache.
    location ~* \.(otf|ttf|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Plaintext AI/SEO descriptors - short cache, correct type.
    location = /llms.txt { default_type text/plain; expires 1h; }
    location = /robots.txt { default_type text/plain; expires 1d; }

    # HTML - always revalidate.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Custom 404 (Astro generates 404.html only if a page exists; fall back to index).
    error_page 404 /index.html;
}
