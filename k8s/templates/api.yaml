apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "openvisor.labels" . | nindent 4 }}
spec:
  # Recreate: the api pod anchors the RWO workspaces volume - never two at once.
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        {{- include "openvisor.workspacesConsumerLabel" . | nindent 8 }}
        {{- include "openvisor.labels" . | nindent 8 }}
    spec:
      {{- include "openvisor.imagePullSecrets" . | nindent 6 }}
      {{- include "openvisor.workspacesAffinity" . | nindent 6 }}
      {{- if .Values.postgres.enabled }}
      # don't bind uvicorn before Postgres accepts connections (the app opens its
      # engine on startup); the migration Job has its own wait
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do sleep 2; done"]
      {{- end }}
      containers:
        - name: api
          image: {{ include "openvisor.image" (dict "root" . "name" "backend") }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["/app/entrypoint.sh", "api"]
          envFrom:
            - secretRef:
                name: {{ .Values.envSecretName }}
          env:
            {{- include "openvisor.backendEnv" . | nindent 12 }}
            # migrations run in the pre-upgrade/post-install Job, not here
            - name: RUN_MIGRATIONS_ON_START
              value: "0"
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: workspaces
              mountPath: /workspaces
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 30
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: workspaces
          persistentVolumeClaim:
            claimName: workspaces
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "openvisor.labels" . | nindent 4 }}
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8000
      targetPort: http
