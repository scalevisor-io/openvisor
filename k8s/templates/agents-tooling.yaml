# MCP tooling reachable from dev-run Jobs: Context7 (live library docs; needs npm
# egress at start - it npx-installs the pinned package) and browser-mcp (the dev
# agent's browser tool: the official Playwright MCP image with its own bundled
# headless chromium, one isolated in-memory browser profile per MCP session).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: context7
  labels:
    {{- include "openvisor.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: context7
  template:
    metadata:
      labels:
        app: context7
        {{- include "openvisor.labels" . | nindent 8 }}
    spec:
      containers:
        - name: context7
          image: {{ .Values.context7.image }}
          command: ["npx", "-y", {{ .Values.context7.package | quote }}, "--transport", "http", "--port", "3000"]
          env:
            - name: CONTEXT7_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.envSecretName }}
                  key: CONTEXT7_API_KEY
                  optional: true
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            {{- toYaml .Values.context7.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: context7
  labels:
    {{- include "openvisor.labels" . | nindent 4 }}
spec:
  selector:
    app: context7
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: browser-mcp
  labels:
    {{- include "openvisor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.browserMcp.replicas }}
  selector:
    matchLabels:
      app: browser-mcp
  template:
    metadata:
      labels:
        app: browser-mcp
        {{- include "openvisor.labels" . | nindent 8 }}
    spec:
      containers:
        - name: browser-mcp
          image: {{ .Values.browserMcp.image }}
          # The image entrypoint already carries --headless --browser chromium
          # --no-sandbox; args append. --isolated = one in-memory browser profile
          # per MCP session, created on connect and destroyed on disconnect, so a
          # killed dev run can never wedge or leak state into another session.
          args:
            - --isolated
            - --port
            - "3000"
            - --host
            - 0.0.0.0
            - --allowed-hosts
            - "*"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          # The liveness probe exercises the REAL path - full MCP session +
          # browser_navigate - because the wedge this architecture replaced kept
          # every shallow check green (HTTP 200, websocket 101) while every
          # actual browser session timed out. A wedged replica is recycled in
          # ~5 minutes instead of living for days.
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - |
                  const http=require('http');
                  const call=(m,h,b)=>new Promise((res,rej)=>{const r=http.request({host:'127.0.0.1',port:3000,path:'/mcp',method:m,headers:h},x=>{let d='';x.on('data',c=>d+=c);x.on('end',()=>res({h:x.headers,d}))});r.on('error',rej);if(b)r.write(JSON.stringify(b));r.end()});
                  (async()=>{
                    const H={'content-type':'application/json','accept':'application/json, text/event-stream'};
                    const i=await call('POST',H,{jsonrpc:'2.0',id:1,method:'initialize',params:{protocolVersion:'2025-03-26',capabilities:{},clientInfo:{name:'liveness',version:'0'}}});
                    const sid=i.h['mcp-session-id']; if(!sid)throw new Error('no session id');
                    const H2=Object.assign({},H,{'mcp-session-id':sid});
                    await call('POST',H2,{jsonrpc:'2.0',method:'notifications/initialized'});
                    const n=await call('POST',H2,{jsonrpc:'2.0',id:2,method:'tools/call',params:{name:'browser_navigate',arguments:{url:'about:blank'}}});
                    await call('DELETE',H2);
                    if(!/about:blank/.test(n.d)||/### Error/.test(n.d))throw new Error('navigate failed: '+n.d.slice(0,160));
                  })().then(()=>process.exit(0)).catch(e=>{console.error(e.message);process.exit(1)});
            initialDelaySeconds: 30
            timeoutSeconds: 50
            periodSeconds: 120
            failureThreshold: 2
          resources:
            {{- toYaml .Values.browserMcp.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: browser-mcp
  labels:
    {{- include "openvisor.labels" . | nindent 4 }}
spec:
  selector:
    app: browser-mcp
  # HTTP MCP sessions live in one replica's memory - keep a client (one sandbox
  # = one pod IP) pinned to the replica that holds its session.
  sessionAffinity: ClientIP
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: websearch-mcp
  labels:
    {{- include "openvisor.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: websearch-mcp
  template:
    metadata:
      labels:
        app: websearch-mcp
        {{- include "openvisor.labels" . | nindent 8 }}
    spec:
      {{- include "openvisor.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: websearch-mcp
          # Web-search MCP for dev runs (§KB `websearch` kind): the mcp image with
          # the websearch app instead of the public MCP server. Stateless - the KB
          # row's provider key rides each request as Authorization: Bearer.
          image: {{ include "openvisor.image" (dict "root" . "name" "mcp") }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["uvicorn", "websearch:app", "--host", "0.0.0.0", "--port", "3000"]
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.websearchMcp.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: websearch-mcp
  labels:
    {{- include "openvisor.labels" . | nindent 4 }}
spec:
  selector:
    app: websearch-mcp
  ports:
    - name: http
      port: 3000
      targetPort: http
{{- if .Values.donsetch.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: donsetch-mcp
  labels:
    {{- include "openvisor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.donsetch.replicas }}
  selector:
    matchLabels:
      app: donsetch-mcp
  template:
    metadata:
      labels:
        app: donsetch-mcp
        {{- include "openvisor.labels" . | nindent 8 }}
    spec:
      {{- include "openvisor.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: donsetch-mcp
          # §web research: the DonSeTch engine behind a stdio->HTTP MCP bridge.
          # Its own image (the engine needs glibc 2.38+ and is AGPL-3.0, so it
          # does not ride the mcp image). Which of search/fetch/crawl a build may
          # call is the §Tools row's capability set, carried in the URL path.
          image: {{ include "openvisor.image" (dict "root" . "name" "donsetch-mcp") }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            # Chrome's own sandbox needs privileges this pod does not have; the
            # container is the isolation boundary. Same trade browser-mcp makes.
            - name: DONGHOST_NO_SANDBOX
              value: "1"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.donsetch.resources | nindent 12 }}
          volumeMounts:
            # Learned cookie lifetimes, page fingerprints and the rerank model.
            # emptyDir, not a PVC: losing it costs a slow first search, and a
            # replica must never inherit another's browsing state.
            - name: cache
              mountPath: /home/donsetch/.cache/donsetch
      volumes:
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: donsetch-mcp
  labels:
    {{- include "openvisor.labels" . | nindent 4 }}
spec:
  selector:
    app: donsetch-mcp
  ports:
    - name: http
      port: 3000
      targetPort: http
{{- end }}
{{- if .Values.mailpit.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels:
    {{- include "openvisor.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
        {{- include "openvisor.labels" . | nindent 8 }}
    spec:
      containers:
        - name: mailpit
          image: {{ .Values.mailpit.image }}
          ports:
            - name: http
              containerPort: 8025
            - name: smtp
              containerPort: 1025
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels:
    {{- include "openvisor.labels" . | nindent 4 }}
spec:
  selector:
    app: mailpit
  ports:
    - name: http
      port: 8025
      targetPort: http
    - name: smtp
      port: 1025
      targetPort: smtp
{{- end }}
